# Nginx đứng trước cluster K8s (Docker Desktop, kind):
#   docker run -d --name vnt-k8s-proxy --network kind -p 8088:80 \
#     -v $PWD/docker/nginx-k8s.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine
# kube-proxy trên node chia tải NodePort 30080 sang các pod.
upstream k8s_api {
    server desktop-control-plane:30080;
    keepalive 16;
}

server {
    listen 80;

    client_max_body_size 20m;

    location / {
        proxy_pass http://k8s_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
