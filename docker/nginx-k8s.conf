# Nginx đứng trước cluster K8s (Docker Desktop, kind):
#   docker create --name vnt-k8s-proxy --network kind --restart unless-stopped \
#     -p 8088:80 -p 3300:3000 -p 9091:9090 nginx:1.27-alpine
#   docker cp docker/nginx-k8s.conf vnt-k8s-proxy:/etc/nginx/conf.d/default.conf
#   docker start vnt-k8s-proxy
# Không bind-mount file (-v): Docker Desktop + WSL mất đường dẫn mount sau khi khởi động lại máy.
# Sửa file này xong: docker cp ... như trên rồi `docker exec vnt-k8s-proxy nginx -s reload`.
# kube-proxy trên node chia tải NodePort 30080 sang các pod.
upstream k8s_api {
    # max_fails=0: chỉ có 1 địa chỉ (NodePort đại diện cả cluster), K8s đã lo health/LB.
    # Mặc định max_fails=1 -> 1 lỗi kết nối là Nginx coi cả cluster chết 10s -> 502 hàng loạt
    # (load test lượt 1-2: 8687 lỗi "no live upstreams" sinh ra từ 964 lỗi kết nối thật).
    server desktop-control-plane:30080 max_fails=0;
    keepalive 16;
}

server {
    listen 80;

    client_max_body_size 20m;

    location / {
        proxy_pass http://k8s_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

# Grafana (NodePort 30030) và Prometheus (NodePort 30090) trong cluster,
# publish ra host: -p 3300:3000 -p 9091:9090
server {
    listen 3000;
    location / {
        proxy_pass http://desktop-control-plane:30030;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}

server {
    listen 9090;
    location / {
        proxy_pass http://desktop-control-plane:30090;
        proxy_set_header Host $host;
    }
}
