# Mount vào /etc/nginx/conf.d/default.conf của image nginx
upstream api {
    server api:8000 max_fails=0;  # tên service trong docker-compose; 1 upstream -> không tự đánh dấu chết
    keepalive 16;
}

server {
    listen 80;

    client_max_body_size 20m;  # ảnh camera vài MB

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
