global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape thẳng Gunicorn (không qua Nginx); /metrics đã gộp mọi worker
  - job_name: vn-traffic-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
