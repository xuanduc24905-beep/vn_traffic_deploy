apiVersion: apps/v1
kind: Deployment
metadata:
  name: vn-traffic-api
  labels:
    app: vn-traffic-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vn-traffic-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vn-traffic-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: vn-traffic-api:latest
          imagePullPolicy: Never  # image build local trong Docker Desktop, không kéo từ registry
          ports:
            - name: http
              containerPort: 8000
          env:
            # Scale theo chiều ngang bằng số pod -> mỗi pod 1 worker
            - name: GUNICORN_WORKERS
              value: "1"
            - name: GUNICORN_THREADS
              value: "12"  # > MAX_INFLIGHT để luôn còn thread cho /health
            - name: ORT_THREADS
              value: "2"  # khớp limits.cpu
            # Backpressure (app/main.py): 1 inference/lần, tối đa 8 /predict trong pod
            # (~8 x 170 ms ≈ 1.4 s chờ tối đa), vượt quá trả 503 + Retry-After ngay.
            # 4 thì quá chặt: kube-proxy chia ngẫu nhiên -> pod này đầy trong khi pod kia rảnh.
            - name: INFER_CONCURRENCY
              value: "1"
            - name: MAX_INFLIGHT
              value: "8"
            # Lưu lịch sử dự đoán vào Postgres (k8s/postgres.yaml); thiếu thì API vẫn chạy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://vntraffic:$(POSTGRES_PASSWORD)@postgres:5432/vntraffic
          resources:
            requests:
              cpu: 500m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          # Liveness chỉ kiểm tra process còn nhận kết nối, không phụ thuộc tải:
          # quá tải mà kill pod thì mất thêm capacity -> sụp dây chuyền (load test lượt 1)
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
